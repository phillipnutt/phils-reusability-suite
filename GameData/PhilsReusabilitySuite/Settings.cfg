// Phil's Reusability Suite: every number the suite uses. Change them here; a ModuleManager patch
// (@PRS_SETTINGS { ... }) works too. Restart KSP after changing them.
PRS_SETTINGS
{
	// Build time in game days = (work / buildBase) ^ buildExponent, where work is the price of the new
	// parts plus the refurbishing of reused ones, without fuel. 20,000 of work takes one day.
	buildBase = 20000
	buildExponent = 0.8

	// Overtime builds this many times faster, for this share of the build price still to build.
	overtimeSpeed = 2
	overtimeCost = 0.25

	// Outsourcing finishes at once, for this share of the build price still to build.
	outsourceCost = 1.0

	// Wear: one number per craft, 0 to 100%, from how hard its flights were. Each flight adds:
	//   speed: up to wearSpeed for its top surface speed, reached at wearSpeedFull m/s;
	//   heat:  nothing while its hottest part stays under wearHeatFrom of that part's own limit, rising to
	//          wearHeat at the limit;
	//   G:     nothing under wearGFrom G, rising to wearG at wearGFull G.
	// A craft at 100% must be refurbished before it flies again. Wear does nothing else.
	wearSpeed = 0.10
	wearSpeedFull = 2500
	wearHeat = 0.30
	wearHeatFrom = 0.5
	wearG = 0.20
	wearGFrom = 3
	wearGFull = 10

	// Refurbishing a flown craft costs its parts' price x its wear x refurbishShare, and takes it back to
	// 0% wear (at 100% wear: half the price of new).
	refurbishShare = 0.5

	// Selling for scrap returns this share of the price.
	scrapValue = 0.5

	// "Update PIP parts": bringing a Phil's Iterative Parts part from an older Mk to its program's
	// current one costs this share of its price for each Mk it moves up (0 = free).
	pipUpdatePerMk = 0.10

	// Build lines per VAB or SPH level (level 1, 2, 3).
	linesPerLevel = 1

	// Only pieces of ships built from a design filed in Phil's Builds come home to the hangar. Pieces of
	// unfiled ships go to the parts bin (their parts still make the next build cheaper).
	requireDesign = true
}
